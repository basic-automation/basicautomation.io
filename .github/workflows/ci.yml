# Continuous integration for basicautomation.io.
#
# Scope note: the build is offline. `npm run sync` talks to GitHub and crates.io
# and is deliberately NOT run here — a rate limit or an upstream hiccup would
# fail CI for a reason no contributor can fix. The committed snapshot in
# data/projects.generated.json is what the build reads, and the site fetches
# live data at request time in production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies move under a frozen lockfile; a weekly run catches a break that
  # no push would have surfaced.
  schedule:
    - cron: "0 5 * * 1"

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx nuxt typecheck
      # Unit tests over the pure helpers in `shared/` only. What a running
      # server proves, `npm run check` proves further down; these cover the
      # awkward input no README on the site happens to contain today.
      - name: Unit tests
        run: npm test
      # The cards themselves are rendered by hand (`npm run og` needs a local
      # Chromium, which this runner has no business installing). The check does
      # not render anything — it recomputes what each committed card was
      # rendered from and fails if the editorial data has moved since.
      - name: Social cards are current
        run: npm run og:check
      # The preloaded core cut of Fira Code, and the unicode-ranges main.css
      # declares for both cuts, must match what the script cuts from the font.
      - name: Font cut is current
        run: npm run font:check
      # Reports every palette colour's contrast against the one background, and
      # fails only on a NEW shortfall. The failures that exist today are on
      # ROADMAP.md awaiting an owner decision, and an always-red check is a
      # check nobody reads.
      - name: No new contrast shortfall
        run: npm run contrast -- --strict
      # The committed image sizes are what the pages reserve space with. A
      # replaced screenshot with the manifest left alone would reserve the wrong
      # shape, which is worse than reserving none.
      - name: Image sizes are current
        run: npm run sizes:check
      - name: Build
        run: npm run build
      # `npm audit` reports the whole lockfile, build tools and dev server
      # included, and stays red on advisories nothing can patch and no visitor
      # can reach. This asks only about what the build put in `.output/server`.
      - name: No high advisory in what the server ships
        run: npm run audit:runtime
      # The build is only half the claim — prove the server actually starts and
      # renders, which a successful bundle does not guarantee. `npm run check`
      # crawls every page, follows every internal link and asset, walks the
      # sitemap, and asserts the 404s are 404s. External links are not followed:
      # somebody else's uptime must not decide whether this PR is green.
      # With the test posts in `test/fixtures/content`: with no posts at all,
      # every blog page is an empty state and a post page never renders.
      - name: Check the rendered site
        env:
          CONTENT_DIR: test/fixtures/content
        run: |
          node .output/server/index.mjs &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break
            sleep 0.5
          done
          npm run check
          # axe-core over the same pages, through jsdom. Structural rules only
          # — the ones that need a layout engine are named and skipped in the
          # script, and the palette's contrast is measured by `npm run contrast`
          # above, which is a stronger check than sampling rendered pixels.
          npm run a11y
          # …and the layout rules jsdom cannot run — target size, keyboard
          # access to scroll regions, the viewport meta — in the Google Chrome
          # the Ubuntu runner already ships, at desktop and phone widths.
          npm run a11y:browser

  onion:
    name: onion gateway
    runs-on: ubuntu-latest
    # A crate in the repo that CI does not build is a crate that is broken by
    # next week. It is not deployed yet (see docs/onion.md), but it compiles,
    # it is linted and its tests run on every change.
    defaults:
      run:
        working-directory: onion
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # rustfmt.toml uses unstable options, which only nightly rustfmt reads.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onion
      - run: cargo +nightly fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The gateway ships in the same image as the site, and `npm run
      # audit:runtime` only sees the Node half. A known vulnerability, a yanked
      # crate or an unsound one fails; "unmaintained" is reported, not fatal —
      # those are arti's dependencies to replace. Reviewed exceptions, each with
      # the reason it cannot reach this binary, are in `.cargo/audit.toml`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny yanked --deny unsound

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # The runtime stage copies the node binary out of `node:24-alpine` into a
      # bare Alpine, so the two Alpines have to be the same one — a mismatch is
      # not a build error, it is a container that dies on a relocation error in
      # production. This pulls the node image, which the build below needs
      # anyway.
      #
      # Invoked directly rather than through `npm run bases`: this job installs
      # no dependencies, and the script needs none.
      - name: Runtime Alpine still matches the node base
        run: node scripts/check-base-images.mjs
      # Build only — publishing happens in release.yml, on a tag.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
