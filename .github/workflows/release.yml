# Publishes the container image when a release is cut.
#
# The nightly dev routine tags and releases from the workstation; this workflow
# is what turns that tag into a pullable image. `workflow_dispatch` is there so
# a failed publish can be retried without re-cutting the release.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/basic-automation/basicautomation.io
          # A nightly tag must not move `latest` — `latest` tracks the stable
          # semver releases, and the nightlies get their own moving pointer.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=raw,value=nightly,enable=${{ github.event.release.prerelease == true }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
