# The service as it appears in the DeepStack compose project
# (`compose-linux/infra.yaml`). Kept here so the deployment is reviewable from
# the repo it deploys.
#
# The image is built on the host rather than pulled: the site is small, the
# build is fast, and it keeps the deploy independent of a registry round-trip.
# `.github/workflows/release.yml` still publishes to GHCR for anyone else.
#
#   docker build -t basicautomation-site:local .
#   docker compose -f 'docker-compose.linux.yaml' up -d basicautomation-site
#
# Caddy terminates TLS for the apex domain and proxies to :3000 over
# caddy-shared-network, so the container publishes no host port.

services:
  basicautomation-site:
    container_name: basicautomation-site
    image: basicautomation-site:local
    build:
      context: .
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      NODE_ENV: production
      PORT: "3000"
      # Optional. Lifts GitHub's anonymous 60 req/hour limit; the site works
      # without it, falling back to the committed snapshot when throttled.
      NUXT_GITHUB_TOKEN: ${BASICAUTOMATION_GITHUB_TOKEN:-}
      # The post editor's credential, checked by the app itself: the same user
      # and bcrypt hash as Caddy's `admin_auth_gate`. Without both the editor
      # is a 404. In the env file, single-quote the hash — it is full of `$`,
      # which compose would otherwise read as variables.
      NUXT_ADMIN_USER: ${BASICAUTOMATION_ADMIN_USER:-}
      NUXT_ADMIN_PASSWORD_HASH: ${BASICAUTOMATION_ADMIN_PASSWORD_HASH:-}
    healthcheck:
      # Exec form, not CMD-SHELL: a distroless runtime has no shell to run it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      # opt in to autoheal — /healthz healthcheck, safe restart
      autoheal: "true"
    networks:
      caddy-shared-network: null
    volumes:
      # The onion service's identity key. This volume IS the .onion address:
      # delete it and the site comes back under a name nothing links to. Named
      # rather than a bind because the image seeds it 0700 owned by the
      # container's unprivileged user and arti refuses to launch if that is
      # loosened — a bind would arrive root-owned 0755 and fail that check.
      - type: volume
        source: basicautomation-onion
        target: /app/tor
      # The blog. Posts are written here by the site's own editor and read back
      # on every request, so they have to outlive an image that is rebuilt on
      # every deploy. Not secret, but it IS the only copy: nothing in git holds
      # these files.
      - type: volume
        source: basicautomation-content
        target: /app/content

networks:
  caddy-shared-network:
    external: true
    name: caddy-shared-network

# Named, so both survive `docker compose up -d` recreating the container. Without
# them the service still starts and still passes its healthcheck — which is what
# makes leaving them out dangerous rather than obviously broken: it would come up
# on a new .onion address with an empty blog.
volumes:
  basicautomation-onion:
  basicautomation-content:
